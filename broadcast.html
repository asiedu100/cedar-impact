<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
      body { font-family: Arial, Helvetica, sans-serif; color: #333; }
      .header { background: #4A148C; color: white; padding: 18px; }
      .content { padding: 18px; }
      .footer { font-size: 0.9rem; color: #666; padding: 14px; }
    </style>
  </head>
  <body>
    <div class="header">
      <h2>{{ subject }}</h2>
    </div>
    <div class="content">
      {{ body|linebreaksbr }}
    </div>
    <div class="footer">
      <p>This message was sent by Cedar Impact Networking Hub.</p>
    </div>
  </body>
</html>
